<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Successful</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f9fafb;
        margin: 0;
        padding: 0;
        color: #1f2937;
      }
      .container {
        max-width: 500px;
        margin: 40px auto;
        background: #ffffff;
        padding: 32px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .success-icon {
        font-size: 40px;
        color: #10b981; /* Secure Green */
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin-top: 0;
        margin-bottom: 16px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #4b5563;
        margin-top: 0;
        margin-bottom: 24px;
      }
      .security-note {
        background-color: #fef2f2; /* Light red/orange warning background */
        border-left: 4px solid #ef4444;
        padding: 16px;
        border-radius: 4px;
        margin-bottom: 24px;
      }
      .security-note p {
        font-size: 14px;
        color: #991b1b;
        margin: 0;
      }
      .security-link {
        color: #ef4444;
        font-weight: 600;
        text-decoration: underline;
      }
      .footer {
        font-size: 14px;
        color: #9ca3af;
        border-top: 1px solid #e5e7eb;
        padding-top: 16px;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="success-icon">✓</div>
      <h1>Password Changed Successfully</h1>
      <p>Dear , {{full_name}}</p>
      <p>
        This is a confirmation that the password for your account has been
        successfully updated. You can now log back into the app using your new
        password.
      </p>

      <div class="security-note">
        <p>Ignore this email you didn't make this change.</p>
      </div>

      <div class="footer">
        <p style="margin: 0">Secured by, Wild life warning app<br />Team</p>
      </div>
    </div>
  </body>
</html>
