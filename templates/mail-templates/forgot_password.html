<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f9fafb;
        margin: 0;
        padding: 0;
        color: #1f2937;
      }
      .container {
        max-width: 500px;
        margin: 40px auto;
        background: #ffffff;
        padding: 32px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin-top: 0;
        margin-bottom: 16px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #4b5563;
        margin-top: 0;
        margin-bottom: 24px;
      }
      .otp-container {
        background-color: #f3f4f6;
        border-radius: 6px;
        padding: 16px;
        text-align: center;
        margin-bottom: 24px;
      }
      .otp-code {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #2563eb; /* Modern blue accent */
        margin: 0;
      }
      .footer {
        font-size: 14px;
        color: #9ca3af;
        border-top: 1px solid #e5e7eb;
        padding-top: 16px;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Dear {{{full_name}}}, Reset Your Password</h1>
      <p>
        We received a request to reset the password for your account. Use the
        verification code below to proceed:
      </p>

      <div class="otp-container">
        <p class="otp-code">{{ otp_code }}</p>
      </div>

      <p>
        This code is valid for <strong>10 minutes</strong>. If you did not
        request a password reset, you can safely ignore this email.
      </p>

      <div class="footer">
        <p style="margin: 0">Thank you,<br />The Team</p>
      </div>
    </div>
  </body>
</html>
